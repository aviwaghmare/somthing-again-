<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Chatbot</title>
  <style>
    :root{
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: rgba(255,255,255,0.08);
      --user: #2563eb;
      --bot: #1f2937;
      --accent: #22c55e;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a 50%, #111827);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }

    .sidebar {
      background: rgba(17, 24, 39, 0.95);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #22c55e, #2563eb);
      font-size: 20px;
      font-weight: bold;
      color: white;
    }

    .brand h1 {
      font-size: 18px;
      line-height: 1.1;
    }

    .brand p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .new-chat-btn {
      border: none;
      background: linear-gradient(135deg, #2563eb, #22c55e);
      color: white;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .new-chat-btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .chat-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .chat-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .chat-item.active {
      outline: 2px solid rgba(34, 197, 94, 0.7);
      background: rgba(34, 197, 94, 0.08);
    }

    .chat-item-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .chat-item-preview {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      min-width: 0;
    }

    .topbar {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar h2 {
      font-size: 18px;
    }

    .topbar small {
      color: var(--muted);
    }

    .toggle {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .messages {
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(780px, 85%);
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .user .bubble {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-top-right-radius: 6px;
    }

    .bot .bubble {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border-top-left-radius: 6px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 14px;
      font-weight: bold;
    }

    .user .avatar {
      background: #1d4ed8;
      color: #fff;
    }

    .bot .avatar {
      background: #16a34a;
      color: #fff;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #cbd5e1;
      border-radius: 50%;
      animation: bounce 1s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    .input-area {
      padding: 18px 20px 22px;
      border-top: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(10px);
    }

    .composer {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
    }

    textarea {
      flex: 1;
      resize: none;
      background: transparent;
      color: var(--text);
      border: none;
      outline: none;
      font-size: 15px;
      line-height: 1.5;
      min-height: 24px;
      max-height: 160px;
      padding: 4px 2px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      min-width: 100px;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .empty {
      margin: auto;
      text-align: center;
      max-width: 560px;
      color: var(--muted);
      padding: 40px 20px;
    }

    .empty h3 {
      color: var(--text);
      font-size: 22px;
      margin-bottom: 10px;
    }

    .empty p {
      line-height: 1.7;
    }

    /* Light mode */
    body.light {
      --bg: #f8fafc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(15,23,42,0.1);
      --bot: #f8fafc;
      background: linear-gradient(135deg, #e2e8f0, #f8fafc 50%, #ffffff);
    }

    body.light .sidebar,
    body.light .topbar,
    body.light .input-area {
      background: rgba(255,255,255,0.85);
    }

    body.light .bubble {
      box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .bubble {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">AI</div>
        <div>
          <h1>My Chatbot</h1>
          <p>Frontend demo</p>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>

      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h2>Chat Assistant</h2>
          <small>Frontend only for now</small>
        </div>
        <button class="toggle" id="themeToggle">Toggle Theme</button>
      </div>

      <div class="messages" id="messages">
        <div class="empty" id="emptyState">
          <h3>Welcome 👋</h3>
          <p>
            This is your chatbot frontend.<br />
            Type a message below and it will reply with a mock AI response for now.
          </p>
        </div>
      </div>

      <div class="input-area">
        <div class="composer">
          <textarea
            id="userInput"
            placeholder="Type your message... (Enter to send, Shift+Enter for new line)"
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
        <div class="hint">Press Enter to send • Shift + Enter for a new line</div>
      </div>
    </main>
  </div>
<script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const chatListEl = document.getElementById("chatList");
    const themeToggle = document.getElementById("themeToggle");
    const emptyState = document.getElementById("emptyState");

    // Replace '/api/chat' if your backend endpoint path is different (e.g., '/chat' or '/message')
    const BACKEND_URL = "https://somthing-again-back.onrender.com/api/chat";

    let chats = JSON.parse(localStorage.getItem("my_chatbot_chats")) || [
      {
        id: Date.now(),
        title: "New Chat",
        messages: [
          { role: "bot", text: "Hi! I am your chatbot. How can I help you today?" }
        ]
      }
    ];

    let activeChatId = chats[0].id;

    function saveChats() {
      localStorage.setItem("my_chatbot_chats", JSON.stringify(chats));
    }

    function getActiveChat() {
      return chats.find(c => c.id === activeChatId);
    }

    function renderChatList() {
      chatListEl.innerHTML = "";
      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = "chat-item" + (chat.id === activeChatId ? " active" : "");
        item.innerHTML = `
          <div class="chat-item-title">${chat.title}</div>
          <div class="chat-item-preview">${chat.messages.at(-1)?.text || "No messages yet"}</div>
        `;
        item.onclick = () => {
          activeChatId = chat.id;
          renderChatList();
          renderMessages();
        };
        chatListEl.appendChild(item);
      });
    }

    function createMessageBubble(role, text) {
      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "U" : "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      if (role === "user") {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      return row;
    }

    function renderMessages() {
      const chat = getActiveChat();
      messagesEl.innerHTML = "";

      if (!chat || chat.messages.length === 0) {
        messagesEl.appendChild(emptyState);
        return;
      }

      chat.messages.forEach(msg => {
        messagesEl.appendChild(createMessageBubble(msg.role, msg.text));
      });

      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }

    function addMessage(role, text) {
      const chat = getActiveChat();
      chat.messages.push({ role, text });

      if (chat.title === "New Chat" && role === "user") {
        chat.title = text.slice(0, 24) + (text.length > 24 ? "..." : "");
      }

      saveChats();
      renderChatList();
      renderMessages();
    }

    function showTypingIndicator() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.id = "typingRow";
      row.innerHTML = `
        <div class="avatar">AI</div>
        <div class="bubble">
          <span class="typing">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </div>
      `;
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const typingRow = document.getElementById("typingRow");
      if (typingRow) typingRow.remove();
    }

    // Connects to Render Backend
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage("user", text);
      inputEl.value = "";
      autoResize();
      sendBtn.disabled = true;

      showTypingIndicator();

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        removeTypingIndicator();

        // Check response data key (adjust data.reply/data.message depending on your server response format)
        const botReply = data.reply || data.message || data.response || "No response text received.";
        addMessage("bot", botReply);

      } catch (error) {
        console.error("Fetch Error:", error);
        removeTypingIndicator();
        addMessage("bot", "⚠️ Could not connect to backend server. (Note: Render free tier takes ~50 seconds to start up on first request).");
      } finally {
        sendBtn.disabled = false;
      }
    }

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    newChatBtn.addEventListener("click", () => {
      const newChat = {
        id: Date.now(),
        title: "New Chat",
        messages: []
      };
      chats.unshift(newChat);
      activeChatId = newChat.id;
      saveChats();
      renderChatList();
      renderMessages();
      inputEl.focus();
    });

    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("light");
    });

    // Initial render
    renderChatList();
    renderMessages();
    autoResize();
</script>
  
</body>
</html>
